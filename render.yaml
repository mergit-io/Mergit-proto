services:
  - type: web
    name: mergit
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Free tier: no persistent disk (SQLite at /data is ephemeral and re-seeds on
    # boot — fine for a showcase). To make state durable later, add a `disk:` block
    # (name/mountPath /data/sizeGB) and switch `plan` to `starter`.
    plan: free
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /data/mergit.db
      - key: WORKSPACE_DIR
        value: /data/workspace
      - key: RUNTIME_CONFIG_DIR
        value: /data/config
      - key: DEBUG
        value: "false"
      # Deliberately empty — the deployment runs with no gate, and access_gate installs
      # nothing when the password is falsy. Keep the key declared with an empty value
      # rather than deleting the entry: blueprints never DELETE an existing variable, so
      # removing these two lines would leave whatever value is already set in force.
      #
      # THIS LEAVES THE DEPLOYMENT OPEN. POST /api/goals is unauthenticated and the coder
      # agent's code_exec runs unsandboxed Python in the same process as GITHUB_TOKEN.
      - key: ACCESS_PASSWORD
        value: ""
      # No persistent disk on the free plan, so every restart starts from an empty database.
      # This mints a canned goal + 3 verifiable proofs on boot so the dashboard and ledger
      # are never empty for a visitor.
      # Mints a canned goal + 3 proofs when the ledger is empty. It exists because the
      # database used to reset on every deploy. With LITESTREAM_BUCKET set the data
      # persists, and this should be flipped to "false" — it seeds only when empty, so it
      # is harmless either way, but leaving it on hides a broken restore behind a
      # dashboard that always looks populated.
      - key: SEED_DEMO
        value: "true"
      # Groq's free-tier rate limits bite long before 0.1 CPU does.
      - key: MAX_CONCURRENT_TASKS
        value: "3"
      # Chain. "local" runs an in-process EVM that is wiped on every restart — fine for a
      # showcase, but proofs are then only verifiable from inside this container. Set
      # CHAIN_TARGET=monad-testnet plus a funded CHAIN_PRIVATE_KEY to record proofs on the
      # real network, after deploying with scripts/deploy_contracts.py.
      - key: CHAIN_ENABLED
        value: "true"
      - key: CHAIN_TARGET
        value: local
      - key: CHAIN_RPC_URL
        sync: false
      - key: CHAIN_PRIVATE_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Last-resort fallback tier for every model chain. Was set only in the dashboard,
      # so a blueprint re-sync would not have recreated it.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_DEFAULT_REPO
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_GOOGLE_REDIRECT_URI
        sync: false
      # GitHub is no longer an identity provider — it is a *connection*, configured as a
      # GitHub App below. These three are retained only because a blueprint sync never
      # DELETES a variable; leave them empty.
      - key: OAUTH_GITHUB_CLIENT_ID
        sync: false
      - key: OAUTH_GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_GITHUB_REDIRECT_URI
        sync: false

      # ── Identity ────────────────────────────────────────────────────────────
      # Comma-separated. Whoever is listed here can manage the deployment's shared
      # provider keys and model config. Recomputed on every login, so removing an
      # address revokes it at their next sign-in. Never "first user wins": on a public
      # URL the first user is a stranger.
      - key: ADMIN_EMAILS
        sync: false

      # ── Credential vault ────────────────────────────────────────────────────
      # Wraps the per-row data keys that encrypt users' stored OAuth tokens. Read once
      # at startup and removed from the environment before the worker begins, because
      # PUT /api/config/keys writes into os.environ and code_exec inherits it.
      #   python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
      # LOSING THIS MEANS EVERY STORED CONNECTION IS UNRECOVERABLE. Keep a copy.
      - key: MERGIT_KEK_CURRENT
        sync: false
      # Retired keys, "id:base64key" comma-separated. Only needed during a rotation.
      - key: MERGIT_KEK_PREVIOUS
        sync: false

      # ── GitHub App (delegated authority) ────────────────────────────────────
      # A GitHub App, not an OAuth App: the user picks which repositories Mergit may
      # touch at install time and GitHub enforces it, so the allowlist is a property of
      # the credential rather than a prompt instruction.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      # PEM. Paste with literal \n for the newlines — config.github_app_private_key()
      # restores them.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # The webhook receiver FAILS CLOSED without this. Unset, it rejects every event.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

      # ── Slack (delegated authority) ─────────────────────────────────────────
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false

      # ── Durable storage on the free tier ────────────────────────────────────
      # Litestream streams /data/mergit.db to object storage and restores it on boot,
      # which is what makes the free plan's ephemeral disk survivable. Backblaze B2 is
      # the recommended target: unlike R2 its Class A/B/C transactions are free with no
      # daily cap, so there is no operation quota to exhaust.
      #
      # Set the bucket's lifecycle rule to "Keep only the last version of the file" —
      # B2 retains every version by default, and Litestream deletes LTX files as it
      # compacts, so each delete leaves a hidden version that still bills against the
      # free 10 GB. Without the rule the bucket grows without bound.
      #
      # Leave LITESTREAM_BUCKET unset to run without replication (ephemeral, as before).
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false

      # ── Demo posture ────────────────────────────────────────────────────────
      # Unregisters code_exec entirely. It runs model-authored Python in a subprocess of
      # the API server, which is acceptable on a laptop and not on a public URL where
      # POST /api/goals is reachable. Set to "false" only once code_exec runs out of
      # process. This closes the RCE while leaving the showcase fully interactive — a
      # password gate would close it too, and would also kill the demo.
      - key: DEMO_SAFE_MODE
        value: "true"
