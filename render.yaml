services:
  - type: web
    name: mergit
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Free tier: no persistent disk (SQLite at /data is ephemeral and re-seeds on
    # boot — fine for a showcase). To make state durable later, add a `disk:` block
    # (name/mountPath /data/sizeGB) and switch `plan` to `starter`.
    plan: free
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /data/mergit.db
      - key: WORKSPACE_DIR
        value: /data/workspace
      - key: RUNTIME_CONFIG_DIR
        value: /data/config
      - key: DEBUG
        value: "false"
      # REQUIRED on any reachable URL. The API is unauthenticated: POST /api/goals is open
      # and the coder agent's code_exec runs its result in a subprocess, so an open URL is
      # arbitrary code execution, and PUT /api/config/keys rewrites the provider keys.
      #
      # This was `sync: false`, which meant "set it by hand in the dashboard" — and an
      # environment where nobody did got no gate at all. Two of them existed: production,
      # and every pull request preview. Render's blueprint spec is explicit about the
      # second one: "Render does not include `sync: false` environment variables in
      # preview environments." So a preview could not have inherited a password even if
      # production had one, and `mergit-pr-<n>.onrender.com` is guessable.
      #
      # generateValue was minting a random 256-bit value here so that no environment
      # could boot without a gate. It worked — too well: the value it mints is one
      # nobody has seen, so the first sync after a merge locked the operator out of
      # their own deployment with a password only the dashboard knows.
      #
      # Explicitly empty, deliberately. `sync: false` would stop MINTING a new value but
      # leaves any existing one in place — blueprints never delete variables — so the
      # generated password would keep gating the deployment with a value nobody has.
      # An empty value is blueprint-managed and overwrites it on the next sync, and
      # access_gate installs nothing at all when the password is falsy:
      #
      #     def add_access_gate(app, password):
      #         if not password:
      #             return
      #
      # THIS LEAVES THE DEPLOYMENT OPEN. Everything in the paragraph above still applies:
      # POST /api/goals runs unsandboxed Python in the same process as GITHUB_TOKEN.
      # To close it again, put a value here or set one in the dashboard.
      - key: ACCESS_PASSWORD
        value: ""
      # No persistent disk on the free plan, so every restart starts from an empty database.
      # This mints a canned goal + 3 verifiable proofs on boot so the dashboard and ledger
      # are never empty for a visitor.
      - key: SEED_DEMO
        value: "true"
      # Groq's free-tier rate limits bite long before 0.1 CPU does.
      - key: MAX_CONCURRENT_TASKS
        value: "3"
      # Chain. "local" runs an in-process EVM that is wiped on every restart — fine for a
      # showcase, but proofs are then only verifiable from inside this container. Set
      # CHAIN_TARGET=monad-testnet plus a funded CHAIN_PRIVATE_KEY to record proofs on the
      # real network, after deploying with scripts/deploy_contracts.py.
      - key: CHAIN_ENABLED
        value: "true"
      - key: CHAIN_TARGET
        value: local
      - key: CHAIN_RPC_URL
        sync: false
      - key: CHAIN_PRIVATE_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_DEFAULT_REPO
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_GOOGLE_REDIRECT_URI
        sync: false
      - key: OAUTH_GITHUB_CLIENT_ID
        sync: false
      - key: OAUTH_GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_GITHUB_REDIRECT_URI
        sync: false
